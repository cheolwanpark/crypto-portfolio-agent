x-agent-env: &agent-env
  BACKEND_API_URL: ${BACKEND_API_URL:-http://api:8000}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QUEUE_NAME: ${QUEUE_NAME:-chat-agent}
  MAX_WORKERS: ${MAX_WORKERS:-10}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: portfolio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    command: uvicorn src.server:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:-password}@postgres:5432/portfolio
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: python -m src.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://crypto:${POSTGRES_PASSWORD:-password}@postgres:5432/portfolio
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  agent-api:
    build: ./agent
    command: uvicorn src.server:app --host 0.0.0.0 --port 8001
    env_file: .env
    environment:
      <<: *agent-env
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped

  agent-worker:
    build: ./agent
    command: rq worker chat-agent --with-scheduler
    env_file: .env
    environment:
      <<: *agent-env
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }
    restart: unless-stopped
    # Scale with: docker compose up --scale agent-worker=3

  frontend:
    build: ./front
    ports: ["3000:3000"]
    environment:
      AGENT_API_URL: http://agent-api:8001
      DATA_API_URL: http://api:8000
    depends_on: [api, agent-api]
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
